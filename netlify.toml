[build]
  publish = "."

# Minificacao no deploy: o fonte fica legivel com os comentarios que
# documentam as decisoes, e o Netlify entrega a versao enxuta. Evita
# manter um .min a parte, que dessincroniza na primeira edicao esquecida.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[dev]
  publish = "."
  port = 8888
  framework = "#static"
  autoLaunch = false

# CDN de imagens (aceita qualquer URL externa)
[images]
  remote_images = ["https://.*"]

# Redirect www → apex
[[redirects]]
  from = "https://www.example.com/*"
  to = "https://example.com/:splat"
  status = 301
  force = true

# Raiz serve a pagina judah-site (rewrite, nao redirect)
# force = true porque existe um index.html de template na raiz do framework
[[redirects]]
  from = "/"
  to = "/judah-site/index.html"
  status = 200
  force = true

# Headers de seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache dos assets
#
# "immutable" so e seguro quando a URL muda a cada versao (hash no nome).
# Nenhum arquivo aqui tem hash, entao css/js/imagem/video precisam poder ser
# revalidados: o Netlify emite ETag forte e devolve 304 quando nada mudou.
# Sem isso, uma correcao publicada nunca chega em quem ja visitou o site.

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Fonte e o unico caso em que o conteudo nunca muda para a mesma URL
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
